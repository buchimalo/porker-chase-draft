<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b241a">
    <title>ポカチェ ドラフト会議 | 結果一覧</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>
    <div class="app">

        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">PC</div>
                <div class="brand-text">
                    <h1 class="brand-title">ドラフト結果一覧</h1>
                    <p class="brand-sub" id="subtitle">リアルタイム更新</p>
                </div>
            </div>

            <div class="topbar-actions no-obs" style="margin-left:auto">
                <div class="seg" id="view-toggle">
                    <button data-view="grid" class="active">カード</button>
                    <button data-view="matrix">一覧表</button>
                </div>
                <button class="btn2" id="btn-print">印刷 / PDF</button>
                <a class="btn2" href="index.html">ボードへ</a>
            </div>
        </header>

        <section class="panel">
            <div class="panel-body">
                <div id="results-container"></div>
            </div>
        </section>

        <section class="panel no-obs hide" id="lottery-panel">
            <div class="panel-head">
                <h2 class="panel-title">抽選の記録</h2>
            </div>
            <div class="panel-body" id="lottery-log"></div>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/core.js"></script>
    <script src="js/draft-results.js"></script>
</body>

</html>
