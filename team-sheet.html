<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b241a">
    <title>ポカチェ ドラフト会議 | 指名シート</title>
    <link rel="icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>
    <div class="app" style="max-width:720px">

        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" id="team-mark"></div>
                <div class="brand-text">
                    <h1 class="brand-title" id="team-name">チーム選択</h1>
                    <p class="brand-sub">指名シート</p>
                </div>
            </div>

            <div class="round-badge">
                <span class="unit">第</span>
                <span class="num" id="current-round">1</span>
                <span class="unit">巡目</span>
            </div>

            <div class="topbar-actions">
                <button class="btn2 btn2-gold" id="btn-show-results">結果一覧</button>
                <button class="btn2" id="btn-switch-team" title="チームを変更">切替</button>
            </div>
        </header>

        <!-- チーム選択 -->
        <section class="panel hide" id="team-picker">
            <div class="panel-head">
                <h2 class="panel-title">あなたのチームを選択</h2>
            </div>
            <div class="panel-body">
                <div class="check-grid" id="team-choices"></div>
                <p class="panel-note">選択したチームはこの端末に記憶されます。</p>
            </div>
        </section>

        <!-- 本体 -->
        <div id="sheet-main" class="hide">

            <div class="sheet-status" id="sheet-status">
                <span class="sheet-status-icon" id="status-icon">⏳</span>
                <div class="sheet-status-text">
                    <strong id="status-title">読み込み中…</strong>
                    <span id="status-detail"></span>
                </div>
            </div>

            <section class="panel">
                <div class="panel-head">
                    <h2 class="panel-title">指名する</h2>
                    <div class="spacer"></div>
                    <span class="panel-note" id="pool-count"></span>
                </div>
                <div class="panel-body">
                    <div class="field">
                        <label class="field-label" for="player-name">選手名</label>
                        <input type="text" class="input input-lg" id="player-name" placeholder="選手名を入力 / 下から選択"
                            autocomplete="off">
                    </div>

                    <div class="field" id="pool-block">
                        <label class="field-label" for="pool-search">候補選手から選ぶ</label>
                        <input type="text" class="input pool-search" id="pool-search" placeholder="選手名で絞り込み"
                            autocomplete="off">
                        <div class="pool" id="player-pool"></div>
                    </div>

                    <div id="warning-box"></div>

                    <div class="submit-row">
                        <button class="btn2 btn2-lg" id="btn-tentative">仮で出す</button>
                        <button class="btn2 btn2-gold btn2-lg" id="btn-submit">確定して送信</button>
                    </div>
                    <p class="panel-note mt-2" id="submit-note">
                        「仮で出す」は盤面に表示されますが、何度でも変更できます。
                        「確定して送信」を押すと変更できなくなります。
                    </p>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2 class="panel-title">自チームの指名履歴</h2>
                </div>
                <div class="panel-body">
                    <ul class="team-picks" id="team-history"></ul>
                </div>
            </section>

        </div>
    </div>

    <!-- 指名確認モーダル -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">指名の確認</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="muted mb-2">第<span id="confirm-round"></span>巡目の指名として<strong>確定</strong>します。</p>
                    <p style="font-size:1.6rem;font-weight:800;margin:0 0 10px" id="confirmPlayerName"></p>
                    <div id="confirm-warnings"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn2" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn2 btn2-gold" id="btn-confirm">確定する（変更不可）</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 結果一覧モーダル -->
    <div class="modal fade" id="resultsModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">ドラフト結果一覧</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="results-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/core.js"></script>
    <script src="js/team-sheet.js"></script>
</body>

</html>
